<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111412">
<meta name="description" content="ADMITRAIL — Admission Calendar, Application Hub and ExamRoute in one place. Your Admission Journey, On Track.">
<title>ADMITRAIL — Your Admission Journey, On Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111412;--card:#171c19;--card2:#1b221e;--forest:#0b3d2e;--forest-d:#0a2a20;--mint:#00e6a0;--mint-soft:rgba(0,230,160,.1);--line:rgba(190,235,215,.1);--text:#edf3ef;--muted:#92a39a;--out:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,230,160,.3) var(--bg)}
body{min-height:100vh;color:var(--text);background:var(--bg);font:400 16px/1.6 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(60% 50% at 15% 0%,rgba(11,61,46,.65),transparent 70%),radial-gradient(50% 45% at 90% 35%,rgba(11,61,46,.4),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(0,230,160,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,230,160,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 72%)}
a{color:inherit;text-decoration:none}
::selection{background:rgba(0,230,160,.3)}
:focus-visible{outline:2px solid var(--mint);outline-offset:4px;border-radius:14px}
.wrap{width:min(1080px,calc(100% - 40px));margin-inline:auto}
.bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;transform-origin:0 50%;transform:scaleX(var(--p,0));background:var(--mint);box-shadow:0 0 12px var(--mint)}

header{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(17,20,18,.72);border-bottom:1px solid transparent;transition:background .5s var(--out),border-color .5s,box-shadow .5s}
header.scrolled{background:rgba(17,20,18,.92);border-color:var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:82px;transition:min-height .5s var(--out)}
header.scrolled .nav{min-height:66px}
.brand{display:flex;align-items:center;gap:12px;animation:drop 1s var(--out) both}
.brand img{height:42px;width:auto;mix-blend-mode:screen;transition:transform .7s var(--spring),filter .4s}
.brand:hover img{transform:scale(1.08) rotate(-3deg);filter:drop-shadow(0 0 14px rgba(0,230,160,.5))}
.brand b{font:800 23px/1 "Manrope",sans-serif;letter-spacing:.1em}
.brand b span{color:var(--mint)}
.credit{display:flex;align-items:center;gap:14px;text-align:right;animation:drop 1s .12s var(--out) both}
.credit::before{content:"";width:2px;height:34px;border-radius:2px;background:linear-gradient(var(--mint),transparent)}
.credit small{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em}
.credit strong{display:block;font:700 16px/1.3 "Manrope",sans-serif;color:var(--mint);letter-spacing:.01em}
